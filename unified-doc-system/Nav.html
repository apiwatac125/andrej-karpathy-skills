<!-- แถบเมนูร่วมของทุกหน้า — include ผ่าน <?!= include('Nav') ?>
     อ่าน URL เต็มจาก <body data-base> และหน้าปัจจุบันจาก <body data-page>
     (ลิงก์ relative ใช้ไม่ได้ เพราะ HtmlService เสิร์ฟในกรอบ iframe คนละโดเมน) -->
<nav class="no-print" id="appnav">
  <a href="#" data-page="home">หน้ารวม</a>
  <a href="#" data-page="dar">คำขอเอกสาร</a>
  <a href="#" data-page="upload">ส่งเอกสารขอลงนาม</a>
  <a href="#" data-page="archive">คลังเอกสาร</a>
  <a href="#" data-page="audit">ตรวจติดตามภายใน</a>
  <a href="#" data-page="capa">CAPA</a>
</nav>
<script>
  (function () {
    var base = document.body.getAttribute('data-base') || '';
    var here = document.body.getAttribute('data-page') || '';
    var links = document.querySelectorAll('#appnav a');
    for (var i = 0; i < links.length; i++) {
      var p = links[i].getAttribute('data-page');
      links[i].href = (p === 'home') ? base : (base + '?page=' + p);
      if (p === here) links[i].className = 'active';
    }
  })();

  /**
   * เปลี่ยนหน้าภายในระบบ WI
   * - เปิดตรง: ไปที่หน้าต่างบนสุด (location.href ในกรอบ HtmlService จะโหลดหน้าซ้อนในกรอบ sandbox)
   * - เปิดในกรอบของระบบงานเอกสาร (<body data-embed="1">): ส่งให้หน้าหลักเปิดในกรอบเดิม
   *   เพราะลิงก์ target="_top" จะพาออกจากหน้าหลัก — หน้าหลักตรวจสิทธิ์และแนบ session ให้เอง
   *   ส่งให้ทุกชั้นขึ้นไปเพราะไม่รู้ว่า Apps Script ห่อกรอบไว้กี่ชั้น หน้าหลักรับเฉพาะข้อความจากกรอบของตัวเอง
   */
  var WiNav = (function () {
    var base = document.body.getAttribute('data-base') || '';
    var embed = document.body.getAttribute('data-embed') === '1';

    function go(url) {
      if (!embed) {
        window.top.location.href = url;
        return;
      }
      for (var w = window.parent; ; w = w.parent) {
        w.postMessage({ type: 'wi-open', url: url }, '*');
        if (w === window.top) break;
      }
    }

    if (embed) {
      document.addEventListener('click', function (e) {
        var a = e.target.closest ? e.target.closest('a[href]') : null;
        if (!a || a.getAttribute('target') === '_blank' || !base || a.href.indexOf(base) !== 0) return;
        e.preventDefault();
        go(a.href);
      }, true);
    }
    // session ของระบบงานเอกสาร (<body data-session>) — ส่งให้ฟังก์ชัน server ที่ต้องรู้ตัวผู้ใช้
    return { go: go, session: document.body.getAttribute('data-session') || '' };
  })();
</script>

<!-- ============================================================
     ค้นหาเอกสาร — widget ลอยมุมขวาล่าง อยู่ในทุกหน้าเพราะ Nav ถูก include ทุกหน้า
     (include() ไม่ประมวลผล scriptlet จึงแยกเป็นไฟล์ partial ซ้อนอีกชั้นไม่ได้)
     ============================================================ -->
<style>
  #ds-launch {
    position: fixed; right: 20px; bottom: 20px; z-index: 40;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; font-size: 16px; font-weight: 600;
    padding: 11px 18px; border: 0; border-radius: 999px;
    background: var(--brand); color: #fff; cursor: pointer;
    box-shadow: 0 2px 6px rgba(26, 26, 46, .18), 0 12px 28px -12px rgba(26, 26, 46, .5);
  }
  #ds-launch:hover { background: var(--brand-dark); }
  #ds-launch .ds-ico { font-size: 17px; line-height: 1; }

  #ds-panel {
    position: fixed; right: 20px; bottom: 78px; z-index: 41;
    width: 400px; max-width: calc(100vw - 32px);
    max-height: min(70vh, 620px); display: none; flex-direction: column;
    background: #fff; border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 4px 10px rgba(26, 26, 46, .12), 0 24px 48px -20px rgba(26, 26, 46, .55);
  }
  #ds-panel.open { display: flex; }

  #ds-head { padding: 13px 15px 10px; border-bottom: 1px solid var(--border); }
  #ds-head .ds-row { display: flex; align-items: center; gap: 10px; }
  #ds-head b { font-size: 17px; flex: 1; }
  #ds-close {
    background: none; border: 0; color: var(--gray); font-size: 22px;
    line-height: 1; cursor: pointer; padding: 0 2px; margin: 0;
  }
  #ds-close:hover { color: var(--ink); background: none; }
  #ds-q {
    width: 100%; margin-top: 9px; padding: 9px 11px; font-family: inherit; font-size: 16px;
    color: var(--ink); background: #fff; border: 1px solid var(--border); border-radius: 7px;
  }
  #ds-head label {
    display: inline-flex; align-items: center; gap: 6px; margin: 9px 0 0;
    font-size: 14px; font-weight: 400; color: var(--gray);
  }
  #ds-status { font-size: 13px; color: var(--gray); margin-top: 6px; }

  #ds-results { overflow-y: auto; padding: 4px 15px 14px; }
  .ds-hit { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ds-hit:last-child { border-bottom: 0; }
  .ds-hit .ds-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .ds-hit .ds-code { font-weight: 700; font-size: 16px; }
  .ds-hit .ds-title { flex: 1 1 160px; font-size: 16px; }
  .ds-hit .ds-meta { font-size: 13px; color: var(--gray); margin-top: 2px; }
  .ds-snip {
    border-left: 2px solid var(--border); padding: 3px 0 3px 10px; margin-top: 7px;
    font-size: 15px; line-height: 1.5;
  }
  .ds-snip mark { background: #fff3bf; color: inherit; padding: 0 1px; }
  .ds-links { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .ds-empty { padding: 18px 0; color: var(--gray); font-size: 15px; }

  @media (max-width: 520px) {
    #ds-panel { right: 12px; left: 12px; width: auto; bottom: 74px; max-height: 72vh; }
    #ds-launch { right: 12px; bottom: 12px; }
  }
  @media print { #ds-launch, #ds-panel { display: none !important; } }
  /* ในกรอบของระบบงานเอกสาร ใช้เมนูซ้ายและแชทบอทของหน้าหลักแทน */
  body[data-embed="1"] #appnav, body[data-embed="1"] #ds-launch, body[data-embed="1"] #ds-panel { display: none !important; }
</style>

<button id="ds-launch" class="no-print" type="button" aria-expanded="false" aria-controls="ds-panel">
  <span class="ds-ico" aria-hidden="true">&#128269;</span> ค้นหาเอกสาร
</button>

<div id="ds-panel" class="no-print" role="dialog" aria-label="ค้นหาเอกสารในคลัง">
  <div id="ds-head">
    <div class="ds-row">
      <b>ค้นหาในคลังเอกสาร</b>
      <button id="ds-close" type="button" aria-label="ปิด">&times;</button>
    </div>
    <input type="text" id="ds-q" autocomplete="off"
           placeholder="พิมพ์คำที่อยากหา เช่น colony count, ค่าวิกฤต, WI-MB-08">
    <label><input type="checkbox" id="ds-obs"> รวมฉบับยกเลิกใช้และฉบับที่ยังไม่อนุมัติ</label>
    <div id="ds-status"></div>
  </div>
  <div id="ds-results"></div>
</div>

<script>
  (function () {
    var panel = document.getElementById('ds-panel');
    var launch = document.getElementById('ds-launch');
    var q = document.getElementById('ds-q');
    var obs = document.getElementById('ds-obs');
    var out = document.getElementById('ds-results');
    var timer = null;
    var statusLoaded = false;

    function esc(s) {
      return String(s === undefined || s === null ? '' : s).replace(/[&<>"\']/g, function (m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "\'": '&#39;' }[m];
      });
    }

    function badgeClass(s) {
      if (s === 'อนุมัติแล้ว') return 'approved';
      if (s === 'รอทบทวน' || s === 'รออนุมัติ') return 'wait';
      if (s === 'ยกเลิกใช้') return 'obsolete';
      return 'rejected';
    }

    function highlight(text, terms) {
      var html = esc(text);
      (terms || []).forEach(function (t) {
        var safe = esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        html = html.replace(new RegExp(safe, 'gi'), function (m) { return '<mark>' + m + '</mark>'; });
      });
      return html;
    }

    function open() {
      panel.classList.add('open');
      launch.setAttribute('aria-expanded', 'true');
      q.focus();
      if (!statusLoaded) {
        statusLoaded = true;
        google.script.run.withSuccessHandler(function (st) {
          document.getElementById('ds-status').textContent =
            'ค้นถึงเนื้อหาในไฟล์ได้ ' + st.indexed + ' จาก ' + st.approved + ' ฉบับที่บังคับใช้' +
            (st.indexed < st.approved ? ' — ที่เหลือค้นได้เฉพาะชื่อและเลขที่' : '');
        }).withFailureHandler(function () { }).getSearchStatus();
      }
    }

    function close() {
      panel.classList.remove('open');
      launch.setAttribute('aria-expanded', 'false');
    }

    launch.onclick = function () { panel.classList.contains('open') ? close() : open(); };
    document.getElementById('ds-close').onclick = close;
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && panel.classList.contains('open')) close();
    });

    q.addEventListener('input', run);
    obs.addEventListener('change', run);

    function run() {
      var text = q.value.trim();
      if (timer) clearTimeout(timer);
      if (text.length < 2) { out.innerHTML = ''; return; }
      out.innerHTML = '<div class="ds-empty">กำลังค้น...</div>';
      timer = setTimeout(function () {
        google.script.run.withSuccessHandler(render).withFailureHandler(function (err) {
          out.innerHTML = '<div class="ds-empty">ค้นไม่สำเร็จ: ' + esc(err.message) + '</div>';
        }).searchArchive(text, { includeObsolete: obs.checked });
      }, 350);
    }

    function render(res) {
      if (res.tooShort) { out.innerHTML = ''; return; }
      if (!res.hits.length) {
        out.innerHTML = '<div class="ds-empty">ไม่พบเอกสารที่ตรงกับ "' + esc(res.query) + '"' +
          (obs.checked ? '' : '<br>กำลังค้นเฉพาะฉบับที่บังคับใช้ — ติ๊กช่องด้านบนเพื่อค้นฉบับยกเลิกใช้ด้วย') +
          '</div>';
        return;
      }

      var html = '<div class="ds-empty" style="padding:10px 0 2px">พบ ' + res.total + ' ฉบับ' +
        (res.total > res.hits.length ? ' · แสดง ' + res.hits.length + ' อันดับแรก' : '') + '</div>';

      res.hits.forEach(function (h) {
        html += '<div class="ds-hit"><div class="ds-top">' +
          '<span class="ds-code">' + esc(h.docCode) + '</span>' +
          '<span class="ds-title">' + esc(h.docTitle) + '</span>' +
          '<span class="badge ' + badgeClass(h.status) + '">' + esc(h.status) + '</span>' +
          '</div>' +
          '<div class="ds-meta">ฉบับที่ ' + esc(h.editionLabel) +
          (h.effectiveDate ? ' · ประกาศใช้ ' + esc(h.effectiveDate) : '') +
          ' · ' + esc(h.unit) +
          (h.indexed ? '' : ' · ยังไม่ได้ทำ index เนื้อหา') + '</div>';

        h.snippets.forEach(function (sn) {
          html += '<div class="ds-snip">' + highlight(sn, res.terms) + '</div>';
        });

        html += '<div class="ds-links">' +
          (h.fileUrl ? '<a class="badge" href="' + esc(h.fileUrl) + '" target="_blank">ไฟล์เอกสาร</a>' : '') +
          (h.coverPdfUrl ? '<a class="badge" href="' + esc(h.coverPdfUrl) + '" target="_blank">ใบปก PDF</a>' : '') +
          '</div></div>';
      });
      out.innerHTML = html;
    }
  })();
</script>
