<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Styles') ?>
  <style>
    .unit-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .unit-card {
      flex: 1 1 240px; background: #fff; border: 1px solid var(--border); border-radius: 10px;
      padding: 16px 18px; cursor: pointer; text-align: left; color: var(--ink);
    }
    .unit-card:hover { border-color: var(--brand); box-shadow: 0 2px 10px rgba(29, 78, 216, .08); }
    .unit-card b { display: block; font-size: 19px; margin-bottom: 4px; }
    .type-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
    .type-bar button { background: #fff; color: var(--ink); border: 1px solid var(--border); font-size: 16px; padding: 7px 16px; }
    .type-bar button.active { background: var(--brand); border-color: var(--brand); color: #fff; }
    .doc-row { border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 12px 14px; margin-bottom: 10px; }
    .doc-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .doc-head .code { font-weight: 700; font-size: 18px; }
    .doc-head .title { flex: 1 1 240px; }
    .rev-list { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 8px; display: none; }
    .rev-list.open { display: block; }
    .rev-item { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 5px 0; font-size: 16px; }
    .rev-item + .rev-item { border-top: 1px dotted var(--border); }
    .rev-item .rev { font-weight: 600; min-width: 64px; }
    .due { background: #fff6e5; border: 1px solid #f0d08a; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
    .due b { color: var(--warn); }
    .crumb { font-size: 16px; color: var(--gray); margin-bottom: 6px; }
    .crumb a { cursor: pointer; }
  </style>
</head>
<body data-base="<?= baseUrl ?>" data-embed="<?= embed ? '1' : '' ?>" data-page="archive">
<div class="wrap wide">
  <?!= include('Nav') ?>

  <h1>คลังเอกสารคุณภาพ</h1>
  <div class="sub">เลือกงาน → หมวดประเภทเอกสาร → รายการเอกสาร (กดที่เอกสารเพื่อดูประวัติการแก้ไขทุกฉบับ)</div>

  <div id="dueWrap"></div>
  <div id="content" class="msg wait">กำลังโหลดคลังเอกสาร...</div>
</div>

<script>
  var BASE_URL = document.body.getAttribute('data-base');
  var DATA = null;
  // คลังสลับมุมมองด้วย JS state ไม่ใช้ URL hash — HtmlService เสิร์ฟในกรอบ iframe บน
  // googleusercontent.com ลิงก์/hash แบบ relative จะ resolve ผิดโดเมน
  var selectedUnit = null;
  var selectedType = null;
  // การค้นหาอยู่ที่ widget มุมขวาล่าง (Nav.html) — หน้านี้เหลือแค่โหมดเรียกดู

  google.script.run.withSuccessHandler(function (data) {
    DATA = data;
    draw();
  }).withFailureHandler(function (err) {
    document.getElementById('content').className = 'msg err';
    document.getElementById('content').textContent = 'โหลดคลังเอกสารไม่สำเร็จ: ' + err.message;
  }).getArchiveData();

  google.script.run.withSuccessHandler(drawDue).withFailureHandler(function () { }).getDueForReview(90);

  function drawDue(list) {
    if (!list || !list.length) return;
    var html = '<div class="due"><b>ใกล้ถึงกำหนดทบทวน (90 วัน) — ' + list.length + ' ฉบับ</b><div style="margin-top:6px">';
    list.forEach(function (r) {
      html += '<div class="mini" style="color:var(--ink)">' +
        (r.overdue ? '<span style="color:var(--danger)">[เกินกำหนด]</span> ' : '') +
        escapeHtml(r.docCode) + ' ฉบับที่ ' + escapeHtml(r.editionLabel) + ' — ' + escapeHtml(r.docTitle) +
        ' (' + escapeHtml(r.unit) + ') · ' + escapeHtml(r.nextReviewDate) + '</div>';
    });
    html += '</div></div>';
    document.getElementById('dueWrap').innerHTML = html;
  }

  function draw() {
    if (!DATA) return;
    var el = document.getElementById('content');
    el.className = '';

    if (!selectedUnit) { el.innerHTML = drawUnits(); return; }
    el.innerHTML = drawUnitDetail();
    bindDocRows();
  }

  // ---------- ระดับ 1: การ์ดงาน ----------
  function drawUnits() {
    if (!DATA.units.length) {
      return '<div class="card">ยังไม่มีเอกสารในคลัง — ส่งเอกสารฉบับแรกได้ที่หน้า "ส่งเอกสารขอลงนาม"</div>';
    }
    var html = '<div class="unit-grid">';
    DATA.units.forEach(function (u) {
      var approved = 0, pending = 0;
      u.types.forEach(function (t) {
        t.docs.forEach(function (d) {
          if (d.current.status === 'อนุมัติแล้ว') approved++;
          else if (d.current.status === 'รอทบทวน' || d.current.status === 'รออนุมัติ') pending++;
        });
      });
      html += '<button class="unit-card" onclick="openUnit(\'' + jsAttr(u.unit) + '\')">' +
        '<b>' + escapeHtml(u.unit) + '</b>' +
        '<span class="mini">' + u.types.length + ' หมวด · บังคับใช้ ' + approved + ' ฉบับ' +
        (pending ? ' · รอลงนาม ' + pending + ' ฉบับ' : '') + '</span></button>';
    });
    return html + '</div>';
  }

  // ---------- ระดับ 2-3: หมวด + รายการ ----------
  function drawUnitDetail() {
    var u = findUnit(selectedUnit);
    if (!u) { selectedUnit = null; return drawUnits(); }
    if (!selectedType || !u.types.some(function (t) { return t.type === selectedType; })) {
      selectedType = u.types.length ? u.types[0].type : null;
    }

    var html = '<div class="crumb"><a onclick="backToUnits()">← ทุกงาน</a></div>' +
      '<h2 style="margin-top:0">' + escapeHtml(u.unit) + '</h2>' +
      '<div class="type-bar">';
    u.types.forEach(function (t) {
      html += '<button class="' + (t.type === selectedType ? 'active' : '') + '" ' +
        'onclick="openType(\'' + jsAttr(t.type) + '\')">' + escapeHtml(t.label) + ' (' + t.count + ')</button>';
    });
    html += '</div>';

    var active = u.types.filter(function (t) { return t.type === selectedType; })[0];
    if (!active) return html + '<div class="card">ยังไม่มีเอกสารในงานนี้</div>';
    if (!active.docs.length) return html + '<div class="card">ยังไม่มีเอกสารในหมวดนี้</div>';
    active.docs.forEach(function (d) { html += docRowHtml(d, false); });
    return html;
  }

  function docRowHtml(d, isSearch, contextLine) {
    var c = d.current;
    var html = '<div class="doc-row" data-code="' + escapeHtml(d.docCode) + '">' +
      '<div class="doc-head">' +
      '<span class="code">' + escapeHtml(d.docCode) + '</span>' +
      '<span class="title">' + escapeHtml(d.title) + '</span>' +
      '<span class="badge ' + statusClass(c.status) + '">' + escapeHtml(c.status) + '</span>' +
      '<span class="mini">ฉบับที่ ' + escapeHtml(c.editionLabel) + (c.effectiveDate ? ' · ประกาศใช้ ' + escapeHtml(c.effectiveDate) : '') + '</span>' +
      '</div>';
    if (contextLine) html += '<div class="mini">' + escapeHtml(contextLine) + '</div>';
    html += '<div class="mini" style="margin-top:4px">' +
      'จัดทำ: ' + escapeHtml(c.authorName || '-') +
      ' · ทบทวน: ' + escapeHtml(c.reviewerName || '-') +
      ' · อนุมัติ: ' + escapeHtml(c.approverName || '-') +
      (c.nextReviewDate ? ' · ทบทวนถัดไป ' + escapeHtml(c.nextReviewDate) : '') + '</div>';
    html += '<div style="margin-top:8px">' + linksFor(c) +
      (d.revCount > 1
        ? '<button class="ghost toggle-rev" type="button">ประวัติการแก้ไข (' + d.revCount + ' ฉบับ)</button>'
        : '') +
      '</div>';

    html += '<div class="rev-list">';
    d.revisions.forEach(function (r) {
      html += '<div class="rev-item">' +
        '<span class="rev">ฉบับที่ ' + escapeHtml(r.editionLabel) + '</span>' +
        '<span class="badge ' + statusClass(r.status) + '">' + escapeHtml(r.status) + '</span>' +
        '<span style="flex:1 1 200px">' + escapeHtml(r.changeKindLabel || r.title) +
        (r.changeNote ? ' <span class="mini">— ' + escapeHtml(r.changeNote) + '</span>' : '') +
        (r.changePages ? ' <span class="mini">(หน้าที่ ' + escapeHtml(r.changePages) + ')</span>' : '') + '</span>' +
        '<span class="mini">' + escapeHtml(r.effectiveDate || r.updatedAt || '') + '</span>' +
        '<span>' + linksFor(r) + '</span>' +
        '</div>';
    });
    html += '</div></div>';
    return html;
  }

  function linksFor(r) {
    var out = '';
    if (r.fileUrl) out += '<a href="' + escapeHtml(r.fileUrl) + '" target="_blank" class="badge" style="margin-right:6px">ไฟล์เอกสาร</a>';
    if (r.coverPdfUrl) {
      out += '<a href="' + escapeHtml(r.coverPdfUrl) + '" target="_blank" class="badge" style="margin-right:6px">ใบปก PDF</a>';
    } else if (r.registered) {
      out += '<span class="mini" style="margin-right:6px">ลงนามบนกระดาษ</span>';
    } else if (r.status === 'อนุมัติแล้ว') {
      out += '<button class="ghost gen-cover" type="button" data-id="' + escapeHtml(r.docId) +
        '" style="margin-right:6px">สร้างใบปก PDF</button>';
    }
    return out;
  }

  function bindDocRows() {
    var toggles = document.querySelectorAll('.toggle-rev');
    for (var i = 0; i < toggles.length; i++) {
      toggles[i].setAttribute('data-label', toggles[i].textContent);
      toggles[i].onclick = function () {
        var list = this.closest('.doc-row').querySelector('.rev-list');
        list.classList.toggle('open');
        this.textContent = list.classList.contains('open')
          ? 'ซ่อนประวัติการแก้ไข'
          : this.getAttribute('data-label');
      };
    }
    var gens = document.querySelectorAll('.gen-cover');
    for (var j = 0; j < gens.length; j++) {
      gens[j].onclick = function () {
        var btn = this;
        btn.disabled = true;
        btn.textContent = 'กำลังสร้าง...';
        google.script.run.withSuccessHandler(function (res) {
          btn.outerHTML = '<a href="' + res.coverPdfUrl + '" target="_blank" class="badge" style="margin-right:6px">ใบปก PDF</a>';
        }).withFailureHandler(function (err) {
          btn.disabled = false;
          btn.textContent = 'สร้างใบปก PDF';
          alert('สร้างใบปกไม่สำเร็จ: ' + err.message);
        }).regenerateCoverPdf(btn.getAttribute('data-id'));
      };
    }
  }

  // ---------- navigation (state เท่านั้น ไม่แตะ URL) ----------
  function openUnit(unit) { selectedUnit = unit; selectedType = null; draw(); window.scrollTo(0, 0); }
  function openType(type) { selectedType = type; draw(); }
  function backToUnits() { selectedUnit = null; selectedType = null; draw(); }

  function findUnit(name) {
    return DATA.units.filter(function (u) { return u.unit === name; })[0] || null;
  }

  function statusClass(status) {
    if (status === 'อนุมัติแล้ว') return 'approved';
    if (status === 'รอทบทวน' || status === 'รออนุมัติ') return 'wait';
    if (status === 'ยกเลิกใช้') return 'obsolete';
    return 'rejected';
  }

  function escapeHtml(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  /** escape สำหรับใส่ในสตริง JS ภายใน attribute onclick='...' */
  function jsAttr(s) {
    return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
