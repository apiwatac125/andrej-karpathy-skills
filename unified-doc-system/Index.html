<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
  <?!= include('Styles'); ?>
</head>
<body>
  <div id="boot" class="boot">กำลังโหลด...</div>

  <!-- ===== เข้าสู่ระบบ ===== -->
  <div id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <div class="brand">
        <div class="logo js-logo"></div>
        <div><b class="js-title"></b><span class="mini js-org"></span></div>
      </div>
      <div class="field">
        <label for="lg-user">ชื่อผู้ใช้</label>
        <input type="text" id="lg-user" autocomplete="username" autocapitalize="none" required>
      </div>
      <div class="field">
        <label for="lg-pass">รหัสผ่าน</label>
        <input type="password" id="lg-pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primary" id="lg-btn">เข้าสู่ระบบ</button>
      <div class="msg" id="lg-msg"></div>
      <p class="mini">ยังไม่มีบัญชีหรือลืมรหัสผ่าน ติดต่อผู้ดูแลระบบ</p>
    </form>
  </div>

  <!-- ===== หน้าหลัก ===== -->
  <div id="app" class="app" hidden>
    <aside id="side" class="side" aria-label="เมนูระบบ">
      <div class="user">
        <div class="user-head">
          <div class="who">
            <b id="u-name"></b>
            <span id="u-role" class="role-chip"></span>
            <div id="u-unit" class="mini"></div>
          </div>
          <button type="button" class="icon-btn" id="btn-hide" title="ซ่อนแถบเมนู" aria-label="ซ่อนแถบเมนู">&lsaquo;</button>
        </div>
        <div class="user-links">
          <button type="button" class="link" data-view="password">เปลี่ยนรหัสผ่าน</button>
          <button type="button" class="link" data-view="users" id="lnk-users" hidden>จัดการผู้ใช้และสิทธิ์</button>
          <button type="button" class="link" data-view="settings" id="lnk-settings" hidden>ตั้งค่าระบบ</button>
          <button type="button" class="link" id="btn-logout">ออกจากระบบ</button>
        </div>
      </div>
      <nav id="menu"></nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="top">
        <button type="button" class="icon-btn" id="btn-show" title="แสดงแถบเมนู" aria-label="แสดงแถบเมนู">&#9776;</button>
        <div class="logo js-logo"></div>
        <div class="top-title"><b class="js-title"></b><span class="js-org"></span></div>
      </header>
      <div class="bar" id="bar" hidden>
        <span id="bar-path"></span>
        <a id="bar-open" target="_blank" rel="noopener">เปิดในแท็บใหม่</a>
      </div>
      <section class="content" id="content">
        <div id="view" class="view"></div>
        <iframe id="frame" title="หน้าจอของระบบที่เลือก" hidden></iframe>
      </section>
    </div>

    <button type="button" class="bot-btn" id="bot-btn" aria-expanded="false" aria-controls="bot">แชทบอท</button>
    <div id="bot" class="bot" role="dialog" aria-label="แชทบอท" hidden>
      <div class="bot-head">
        <b>แชทบอท</b>
        <button type="button" class="icon-btn" id="bot-close" aria-label="ปิดแชทบอท">&times;</button>
      </div>
      <div class="bot-body" id="bot-log">
        <div class="bot-msg">พิมพ์คำที่ต้องการค้นในคลังเอกสาร เช่น ชื่อบริษัท ชื่อสินค้า ชื่องาน หรือปี พ.ศ.
          ระบบค้นเฉพาะคลังที่คุณมีสิทธิ์เปิด</div>
      </div>
      <form class="bot-input" id="bot-form">
        <input type="text" id="bot-q" placeholder="ค้นหาเอกสาร..." autocomplete="off" aria-label="คำค้นหา">
        <button type="submit" class="primary" id="bot-send">ค้นหา</button>
      </form>
    </div>
  </div>

<script>
  var APP = <?!= JSON.stringify(app) ?>;
  var TOKEN_KEY = 'docsys.token';
  var token = null;
  var shell = null;      // ผลจาก getShell: ผู้ใช้ + เมนูที่เปิดได้
  var current = null;    // id ของเมนูที่เปิดอยู่
  var users = [];        // รายชื่อในหน้าจัดการผู้ใช้
  var narrow = window.matchMedia('(max-width: 860px)');

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function setMsg(id, text, cls) {
    var el = $(id);
    if (!el) return;
    el.textContent = text || '';
    el.className = 'msg ' + (cls || '');
  }

  // token อยู่ใน sessionStorage — ปิดแท็บแล้วต้องเข้าสู่ระบบใหม่ (บางเบราว์เซอร์ปิด storage จึงต้องมี try)
  function keepToken(t) {
    token = t;
    try {
      if (t) sessionStorage.setItem(TOKEN_KEY, t);
      else sessionStorage.removeItem(TOKEN_KEY);
    } catch (e) { }
  }
  function savedToken() {
    try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }

  /** เรียกฟังก์ชันฝั่ง server — session หมดอายุ (SESSION_EXPIRED ใน Auth.gs) จะพากลับหน้าเข้าสู่ระบบ */
  function call(fn, args, ok, fail) {
    var runner = google.script.run.withSuccessHandler(ok).withFailureHandler(function (err) {
      if (err.message.indexOf('เข้าสู่ระบบใหม่') > -1) {
        keepToken(null);
        showLogin(err.message);
        return;
      }
      if (fail) fail(err);
    });
    runner[fn].apply(runner, args);
  }

  function drawBrand() {
    document.querySelectorAll('.js-title').forEach(function (el) { el.textContent = APP.title; });
    document.querySelectorAll('.js-org').forEach(function (el) { el.textContent = APP.org; });
    document.querySelectorAll('.js-logo').forEach(function (el) {
      if (APP.logoUrl) el.innerHTML = '<img src="' + esc(APP.logoUrl) + '" alt="โลโก้">';
      else el.textContent = 'โลโก้';
      el.classList.toggle('empty', !APP.logoUrl);
    });
  }

  // ============================================================
  // เข้าสู่ระบบ / ออกจากระบบ
  // ============================================================
  var BOT_GREETING = $('bot-log').innerHTML;

  function showLogin(msg) {
    shell = null;
    current = null;
    $('frame').src = 'about:blank';
    $('bot-log').innerHTML = BOT_GREETING;   // ไม่ให้ผู้ใช้คนถัดไปเห็นผลค้นของคนก่อน
    setBot(false);
    $('boot').hidden = true;
    $('app').hidden = true;
    $('login').hidden = false;
    setMsg('lg-msg', msg, 'err');
    $('lg-user').focus();
  }

  $('login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    $('lg-btn').disabled = true;
    setMsg('lg-msg', 'กำลังตรวจสอบ...', 'wait');
    call('login', [$('lg-user').value, $('lg-pass').value], function (res) {
      $('lg-btn').disabled = false;
      $('lg-pass').value = '';
      keepToken(res.token);
      loadShell();
    }, function (err) {
      $('lg-btn').disabled = false;
      setMsg('lg-msg', err.message, 'err');
    });
  });

  $('btn-logout').onclick = function () {
    call('logout', [token], function () { });
    keepToken(null);
    showLogin('');
  };

  function loadShell() {
    call('getShell', [token], function (data) {
      shell = data;
      $('boot').hidden = true;
      $('login').hidden = true;
      $('app').hidden = false;
      $('u-name').textContent = data.user.name || data.user.username;
      $('u-role').textContent = data.user.roleLabel;
      $('u-unit').textContent = data.user.unit || '';
      $('lnk-users').hidden = !data.isAdmin;
      $('lnk-settings').hidden = !data.isAdmin;
      drawMenu();
      setMenu(!narrow.matches);
      openBuiltin('welcome');
    }, function (err) {
      keepToken(null);
      showLogin(err.message);
    });
  }

  // ============================================================
  // แถบเมนู
  // ============================================================
  function drawMenu() {
    var html = '';
    shell.menu.forEach(function (g) {
      if (g.slot) {
        html += '<div class="slot">ช่องสำรองสำหรับระบบใหม่</div>';
        return;
      }
      html += '<div class="group"><div class="group-name">' + esc(g.group) + '</div>';
      g.items.forEach(function (it) {
        html += '<button type="button" class="item" data-id="' + esc(it.id) + '">' + esc(it.label) +
          (it.ready ? '' : '<span class="soon">เร็วๆ นี้</span>') + '</button>';
      });
      html += '</div>';
    });
    $('menu').innerHTML = html;
  }

  function findItem(id) {
    for (var i = 0; i < shell.menu.length; i++) {
      var g = shell.menu[i];
      for (var j = 0; g.items && j < g.items.length; j++) {
        if (g.items[j].id === id) return { group: g.group, item: g.items[j] };
      }
    }
    return null;
  }

  function markActive(id) {
    document.querySelectorAll('#menu .item').forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-id') === id);
    });
  }

  function setMenu(open) { $('app').classList.toggle('menu-hidden', !open); }

  $('btn-hide').onclick = function () { setMenu(false); };
  $('btn-show').onclick = function () { setMenu(true); };
  $('scrim').onclick = function () { setMenu(false); };
  if (narrow.addEventListener) narrow.addEventListener('change', function () { setMenu(!narrow.matches); });

  $('menu').onclick = function (e) {
    var b = e.target.closest('[data-id]');
    if (b) openItem(b.getAttribute('data-id'));
  };
  document.querySelectorAll('[data-view]').forEach(function (b) {
    b.onclick = function () { openBuiltin(b.getAttribute('data-view')); };
  });
  $('view').onclick = function (e) {
    var go = e.target.closest('[data-id]');
    if (go) return openItem(go.getAttribute('data-id'));
    var ed = e.target.closest('[data-edit]');
    if (ed) editUser(users[Number(ed.getAttribute('data-edit'))]);
  };

  // ============================================================
  // กรอบเนื้อหา: หน้าระบบที่เลือก (iframe) หรือหน้าที่ระบบหลักวาดเอง (#view)
  // ============================================================
  function openItem(id) {
    var hit = findItem(id);
    if (!hit) return;
    current = id;
    markActive(id);
    if (narrow.matches) setMenu(false);
    showView('<div class="msg wait">กำลังเปิด ' + esc(hit.item.label) + '...</div>', hit);
    call('openItem', [token, id], function (res) {
      if (current !== id) return;   // ระหว่างรอ ผู้ใช้กดเมนูอื่นไปแล้ว
      if (res.url) showFrame(hit, res.url);
      else if (res.missing) showView(viewMissing(hit, res.missing), hit);
      else showView(viewSoon(hit), hit);
    }, function (err) {
      if (current === id) showView(viewError(hit, err.message), hit);
    });
  }

  function openBuiltin(name) {
    current = null;
    markActive(null);
    if (narrow.matches) setMenu(false);
    if (name === 'users') {
      showView(viewUsers());
      loadUsers();
    } else if (name === 'settings') {
      showView(viewSettings());
      loadSettings();
    } else if (name === 'password') {
      showView(viewPassword());
      bindPassword();
    } else {
      showView(viewWelcome());
    }
  }

  function showView(html, hit) {
    $('frame').hidden = true;
    $('frame').src = 'about:blank';
    $('view').hidden = false;
    $('view').innerHTML = html;
    $('content').scrollTop = 0;
    drawBar(hit, '');
  }

  function showFrame(hit, url) {
    $('view').hidden = true;
    $('frame').hidden = false;
    $('frame').src = url;
    drawBar(hit, url);
  }

  function drawBar(hit, url) {
    $('bar').hidden = !hit;
    if (!hit) return;
    $('bar-path').textContent = hit.group + ' › ' + hit.item.label;
    $('bar-open').hidden = !url;
    if (url) $('bar-open').href = url;
  }

  function heading(hit) {
    return '<h1>' + esc(hit.item.label) + '</h1><div class="sub">' + esc(hit.group) + '</div>';
  }

  function viewWelcome() {
    var u = shell.user;
    var html = '<h1>สวัสดี คุณ' + esc(u.name || u.username) + '</h1>' +
      '<div class="sub">เข้าสู่ระบบในฐานะ <b>' + esc(u.roleLabel) + '</b> — เลือกระบบจากเมนูด้านซ้ายหรือจากรายการด้านล่าง</div>' +
      '<div class="groups">';
    shell.menu.forEach(function (g) {
      if (g.slot) return;
      html += '<div class="card"><h3>' + esc(g.group) + '</h3><div class="links">';
      g.items.forEach(function (it) {
        html += '<button type="button" class="go" data-id="' + esc(it.id) + '">' + esc(it.label) +
          (it.ready ? '' : '<span class="soon">เร็วๆ นี้</span>') + '</button>';
      });
      html += '</div></div>';
    });
    return html + '</div>';
  }

  function viewSoon(hit) {
    return heading(hit) + '<div class="card">ระบบนี้อยู่ระหว่างพัฒนา เมนูเตรียมไว้แล้ว ' +
      'เมื่อระบบพร้อม หน้าจอของระบบจะแสดงในกรอบนี้</div>';
  }

  function viewMissing(hit, prop) {
    return heading(hit) + '<div class="notice">ยังไม่ได้เชื่อมต่อระบบนี้ กรุณาแจ้งผู้ดูแลระบบ' +
      (shell.isAdmin
        ? '<div class="mini">สำหรับผู้ดูแล: ตั้ง Script Property <code>' + esc(prop) + '</code> ' +
          'เป็น URL เว็บแอปของระบบ (ลงท้ายด้วย /exec) ที่ Apps Script › Project Settings › Script Properties</div>'
        : '') +
      '</div>';
  }

  function viewError(hit, message) {
    return heading(hit) + '<div class="notice">' + esc(message) + '</div>';
  }

  // ============================================================
  // เปลี่ยนรหัสผ่าน
  // ============================================================
  function field(id, label, type, value, attrs) {
    return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' +
      '<input type="' + type + '" id="' + id + '" value="' + esc(value || '') + '"' + (attrs ? ' ' + attrs : '') + '></div>';
  }

  function viewPassword() {
    return '<h1>เปลี่ยนรหัสผ่าน</h1><div class="sub">รหัสผ่านใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร</div>' +
      '<form class="card" id="pw-form">' +
      field('pw-old', 'รหัสผ่านเดิม', 'password', '', 'autocomplete="current-password" required') +
      field('pw-new', 'รหัสผ่านใหม่', 'password', '', 'autocomplete="new-password" required') +
      field('pw-again', 'ยืนยันรหัสผ่านใหม่', 'password', '', 'autocomplete="new-password" required') +
      '<button type="submit" class="primary" id="pw-btn">บันทึกรหัสผ่านใหม่</button>' +
      '<div class="msg" id="pw-msg"></div></form>';
  }

  function bindPassword() {
    $('pw-form').onsubmit = function (e) {
      e.preventDefault();
      if ($('pw-new').value !== $('pw-again').value) {
        setMsg('pw-msg', 'รหัสผ่านใหม่สองช่องไม่ตรงกัน', 'err');
        return;
      }
      $('pw-btn').disabled = true;
      setMsg('pw-msg', 'กำลังบันทึก...', 'wait');
      call('changePassword', [token, $('pw-old').value, $('pw-new').value], function () {
        $('pw-form').reset();
        $('pw-btn').disabled = false;
        setMsg('pw-msg', 'เปลี่ยนรหัสผ่านแล้ว ใช้รหัสใหม่ในการเข้าสู่ระบบครั้งถัดไป', 'ok');
      }, function (err) {
        $('pw-btn').disabled = false;
        setMsg('pw-msg', err.message, 'err');
      });
    };
  }

  // ============================================================
  // จัดการผู้ใช้และสิทธิ์ (หัวหน้ากลุ่มงาน)
  // ============================================================
  function viewUsers() {
    return '<h1>จัดการผู้ใช้และสิทธิ์</h1>' +
      '<div class="sub">ระดับสิทธิ์ของแต่ละคนกำหนดว่าเห็นและเปิดเมนูใดได้บ้าง</div>' +
      '<div class="card"><div class="card-head"><h3>ผู้ใช้ทั้งหมด</h3>' +
      '<button type="button" class="ghost" id="u-add">+ เพิ่มผู้ใช้</button></div>' +
      '<form id="u-form" class="subform" hidden></form>' +
      '<div class="msg" id="u-done"></div>' +
      '<div id="u-list" class="msg wait">กำลังโหลด...</div></div>' +
      '<div class="card"><h3>ระดับสิทธิ์กับเมนูที่เปิดได้</h3>' + accessTable() +
      '<div class="mini">แก้ระดับต่ำสุดของแต่ละเมนูได้ที่หน้า "ตั้งค่าระบบ"</div></div>';
  }

  function accessTable() {
    var html = '<div class="scroll-x"><table class="list"><tr><th>เมนู</th>';
    shell.roles.forEach(function (r) { html += '<th class="c">' + esc(r.label) + '</th>'; });
    html += '</tr>';
    var rows = shell.access.concat([{ group: 'ระบบหลัก', label: 'จัดการผู้ใช้และตั้งค่าระบบ', minLevel: shell.adminLevel }]);
    rows.forEach(function (a) {
      html += '<tr><td>' + esc(a.label) + '<div class="mini">' + esc(a.group) + '</div></td>';
      shell.roles.forEach(function (r) {
        html += '<td class="c">' + (r.level >= a.minLevel
          ? '<span class="yes" aria-label="เปิดได้">&#10003;</span>'
          : '<span class="no" aria-label="เปิดไม่ได้">&ndash;</span>') + '</td>';
      });
      html += '</tr>';
    });
    return html + '</table></div>';
  }

  function loadUsers() {
    $('u-add').onclick = function () { editUser(null); };
    call('adminListUsers', [token], function (list) {
      users = list;
      drawUsers();
    }, function (err) {
      setMsg('u-list', err.message, 'err');
    });
  }

  function drawUsers() {
    var el = $('u-list');
    if (!el) return;   // ผู้ใช้ออกจากหน้านี้ไปแล้ว
    el.className = '';
    var html = '<div class="scroll-x"><table class="list"><tr>' +
      '<th>ชื่อผู้ใช้</th><th>ชื่อ-นามสกุล</th><th>งาน</th><th>ระดับสิทธิ์</th><th>สถานะ</th><th></th></tr>';
    users.forEach(function (u, i) {
      html += '<tr' + (u.active ? '' : ' class="off"') + '>' +
        '<td class="mono">' + esc(u.username) + '</td>' +
        '<td>' + esc(u.name) + '</td>' +
        '<td>' + esc(u.unit) + '</td>' +
        '<td>' + esc(u.roleLabel) + '</td>' +
        '<td>' + (u.active ? 'ใช้งาน' : 'ปิดบัญชี') + '</td>' +
        '<td><button type="button" class="ghost" data-edit="' + i + '">แก้ไข</button></td></tr>';
    });
    el.innerHTML = html + '</table></div>';
  }

  function editUser(u) {
    var isNew = !u;
    u = u || { username: '', name: '', email: '', unit: '', role: 'staff', active: true };
    var f = $('u-form');
    var roles = shell.roles.map(function (r) {
      return '<option value="' + esc(r.key) + '"' + (r.key === u.role ? ' selected' : '') + '>' + esc(r.label) + '</option>';
    }).join('');
    f.innerHTML = '<h4>' + (isNew ? 'เพิ่มผู้ใช้ใหม่' : 'แก้ไขผู้ใช้ ' + esc(u.username)) + '</h4>' +
      '<div class="row">' +
      field('f-username', 'ชื่อผู้ใช้ (ใช้เข้าสู่ระบบ)', 'text', u.username, 'autocapitalize="none"' + (isNew ? '' : ' readonly')) +
      field('f-name', 'ชื่อ-นามสกุล', 'text', u.name) + '</div>' +
      '<div class="row">' +
      field('f-unit', 'งาน / หน่วยงาน', 'text', u.unit) +
      field('f-email', 'อีเมล', 'email', u.email) + '</div>' +
      '<div class="row"><div class="field"><label for="f-role">ระดับสิทธิ์</label><select id="f-role">' + roles + '</select></div>' +
      field('f-password', isNew ? 'รหัสผ่านชั่วคราว' : 'ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)', 'password', '', 'autocomplete="new-password"') +
      '</div>' +
      '<label class="check"><input type="checkbox" id="f-active"' + (u.active ? ' checked' : '') + '> เปิดใช้งานบัญชี</label>' +
      '<div class="actions"><button type="submit" class="primary" id="f-save">บันทึก</button>' +
      '<button type="button" class="ghost" id="f-cancel">ยกเลิก</button></div>' +
      '<div class="msg" id="f-msg"></div>';
    f.hidden = false;
    setMsg('u-done', '');
    f.onsubmit = function (e) {
      e.preventDefault();
      saveUser(isNew);
    };
    $('f-cancel').onclick = function () { f.hidden = true; };
    $(isNew ? 'f-username' : 'f-name').focus();
  }

  function saveUser(isNew) {
    var data = {
      isNew: isNew,
      username: $('f-username').value,
      name: $('f-name').value,
      unit: $('f-unit').value,
      email: $('f-email').value,
      role: $('f-role').value,
      active: $('f-active').checked,
      password: $('f-password').value
    };
    $('f-save').disabled = true;
    setMsg('f-msg', 'กำลังบันทึก...', 'wait');
    call('adminSaveUser', [token, data], function () {
      $('u-form').hidden = true;
      setMsg('u-done', 'บันทึกผู้ใช้ ' + data.username.trim().toLowerCase() + ' แล้ว', 'ok');
      loadUsers();
    }, function (err) {
      $('f-save').disabled = false;
      setMsg('f-msg', err.message, 'err');
    });
  }

  // ============================================================
  // ตั้งค่าระบบ (ผู้ดูแลระบบ) — Settings.gs
  // ============================================================
  function viewSettings() {
    return '<h1>ตั้งค่าระบบ</h1>' +
      '<div class="sub">เฉพาะผู้ดูแลระบบ — บันทึกแล้วมีผลกับผู้ใช้ทุกคนทันที</div>' +
      '<form id="set-form"><div id="set-body" class="msg wait">กำลังโหลด...</div></form>';
  }

  function loadSettings() {
    call('adminGetSettings', [token], drawSettings, function (err) {
      setMsg('set-body', err.message, 'err');
    });
  }

  function drawSettings(s) {
    var body = $('set-body');
    if (!body) return;   // ผู้ใช้ออกจากหน้านี้ไปแล้ว
    var html = '<div class="card"><h3>ข้อมูลหน้าระบบ</h3>' +
      field('set-title', 'ชื่อระบบ', 'text', s.app.title) +
      field('set-org', 'หน่วยงาน', 'text', s.app.org) +
      field('set-logo', 'URL รูปโลโก้ (เว้นว่าง = ไม่มีโลโก้)', 'text', s.app.logoUrl, 'placeholder="https://..."') +
      '</div><div class="card"><h3>การเชื่อมต่อระบบ</h3>';
    s.links.forEach(function (l) {
      html += field('link-' + l.key, l.label + ' (' + l.hint + ')', 'text', l.value, 'autocapitalize="none"');
    });
    html += '</div><div class="card"><h3>ระดับสิทธิ์ต่ำสุดของแต่ละเมนู</h3>' +
      '<div class="mini">ผู้ใช้ระดับนี้ขึ้นไปจึงเห็นและเปิดเมนูได้</div>' +
      '<div class="scroll-x"><table class="list"><tr><th>เมนู</th><th>ระดับต่ำสุด</th></tr>';
    s.items.forEach(function (it) {
      html += '<tr><td>' + esc(it.label) + '<div class="mini">' + esc(it.group) + '</div></td><td>' +
        '<select id="lv-' + esc(it.id) + '" aria-label="ระดับต่ำสุดของ ' + esc(it.label) + '">' +
        s.roles.map(function (r) {
          return '<option value="' + r.level + '"' + (r.level === it.level ? ' selected' : '') + '>' + esc(r.label) +
            (r.level === it.defaultLevel ? ' (ค่าเริ่มต้น)' : '') + '</option>';
        }).join('') + '</select></td></tr>';
    });
    html += '</table></div></div>' +
      '<div class="actions"><button type="submit" class="primary" id="set-save">บันทึกการตั้งค่า</button></div>' +
      '<div class="msg" id="set-msg"></div>';
    body.className = '';
    body.innerHTML = html;
    $('set-form').onsubmit = function (e) {
      e.preventDefault();
      saveSettings(s);
    };
  }

  function saveSettings(s) {
    var data = {
      app: { title: $('set-title').value, org: $('set-org').value, logoUrl: $('set-logo').value },
      links: {},
      levels: {}
    };
    s.links.forEach(function (l) { data.links[l.key] = $('link-' + l.key).value; });
    s.items.forEach(function (it) { data.levels[it.id] = Number($('lv-' + it.id).value); });
    $('set-save').disabled = true;
    setMsg('set-msg', 'กำลังบันทึก...', 'wait');
    call('adminSaveSettings', [token, data], function (res) {
      $('set-save').disabled = false;
      setMsg('set-msg', 'บันทึกการตั้งค่าแล้ว', 'ok');
      APP = res.app;
      drawBrand();
      refreshShell();
    }, function (err) {
      $('set-save').disabled = false;
      setMsg('set-msg', err.message, 'err');
    });
  }

  /** โหลดเมนูใหม่หลังแก้ระดับสิทธิ์ โดยไม่เปลี่ยนหน้าที่เปิดอยู่ */
  function refreshShell() {
    call('getShell', [token], function (data) {
      shell = data;
      drawMenu();
      markActive(current);
    });
  }

  // ============================================================
  // แชทบอท — ค้นเอกสารในคลัง (searchDocs ใน Search.gs)
  // ============================================================
  function setBot(open) {
    $('bot').hidden = !open;
    $('bot-btn').setAttribute('aria-expanded', String(open));
    if (open) $('bot-q').focus();
  }
  $('bot-btn').onclick = function () { setBot($('bot').hidden); };
  $('bot-close').onclick = function () { setBot(false); };

  function botSay(mine, html) {
    var el = document.createElement('div');
    el.className = 'bot-msg' + (mine ? ' me' : '');
    el.innerHTML = html;
    $('bot-log').appendChild(el);
    $('bot-log').scrollTop = $('bot-log').scrollHeight;
    return el;
  }

  $('bot-form').onsubmit = function (e) {
    e.preventDefault();
    var q = $('bot-q').value.trim();
    if (!q) return;
    $('bot-q').value = '';
    botSay(true, esc(q));
    var reply = botSay(false, '<span class="mini">กำลังค้น...</span>');
    call('searchDocs', [token, q], function (res) {
      reply.innerHTML = botReply(res);
      $('bot-log').scrollTop = $('bot-log').scrollHeight;
    }, function (err) {
      reply.textContent = 'ค้นไม่สำเร็จ: ' + err.message;
    });
  };

  function botReply(res) {
    if (res.tooShort) return 'พิมพ์คำค้นอย่างน้อย 2 ตัวอักษร';
    if (!res.sources.length) {
      return res.missing.length
        ? 'ยังไม่ได้เชื่อม' + esc(res.missing.join(', ')) + 'กับแชทบอท กรุณาแจ้งผู้ดูแลระบบ'
        : 'ระดับสิทธิ์ของคุณยังไม่มีคลังที่ค้นจากแชทบอทได้';
    }
    if (!res.total) {
      return 'ไม่พบเอกสารที่ตรงกับ "' + esc(res.query) + '" ใน' + esc(res.sources.join(', ')) +
        '<div class="mini">ลองใช้คำที่สั้นลง หรือค้นด้วยชื่อบริษัทอย่างเดียว</div>';
    }
    return 'พบ ' + res.total + ' รายการ' + (res.total > res.hits.length ? ' แสดง ' + res.hits.length + ' รายการแรก' : '') +
      res.hits.map(function (h) { return hitHtml(h, res.terms); }).join('');
  }

  function hitHtml(h, terms) {
    var cls = h.status === 'อนุมัติแล้ว' ? 'ok' : (h.status.indexOf('ไม่อนุมัติ') > -1 ? 'bad' : 'wait');
    return '<div class="hit">' +
      '<div class="mini">' + esc(h.kind) + '</div>' +
      '<b>' + mark(h.title, terms) + '</b>' +
      '<div class="mini">' + esc(h.meta) + '</div>' +
      (h.detail ? '<div>' + esc(h.detail) + '</div>' : '') +
      (h.companies.length ? '<div class="mini">ตรงกับ: ' + h.companies.map(function (c) { return mark(c, terms); }).join(', ') + '</div>' : '') +
      '<div class="hit-links"><span class="status ' + cls + '">' + esc(h.status) + '</span>' +
      h.links.map(function (l) {
        return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + '</a>';
      }).join('') + '</div></div>';
  }

  /** ไฮไลต์คำค้นในข้อความ — escape ก่อน แล้วแทนทุกคำในรอบเดียว กันไปโดน <mark> ที่ใส่ไปแล้ว */
  function mark(text, terms) {
    var re = new RegExp(terms.map(function (t) {
      return esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('|'), 'gi');
    return esc(text).replace(re, function (m) { return '<mark>' + m + '</mark>'; });
  }

  // ============================================================
  // เริ่มต้น
  // ============================================================
  drawBrand();
  if (savedToken()) {
    token = savedToken();
    loadShell();
  } else {
    showLogin('');
  }
</script>
</body>
</html>
