<!-- CSS กลางของทุกหน้า — include ผ่าน <?!= include('Styles') ?> -->
<style>
  :root {
    --ink: #1a1a2e;
    --gray: #6b7280;
    --border: #d9dde3;
    --bg: #f3f7fa;
    /* สีจากโลโก้โรงพยาบาลเลิดสิน ชุดเดียวกับ ShellStyles.html ของหน้าหลัก */
    --brand: #0d77a5;
    --brand-dark: #0b668e;
    --ok: #0f7b4f;
    --warn: #b45309;
    --danger: #b42318;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Sarabun', 'TH SarabunPSK', 'Segoe UI', sans-serif;
    font-size: 18px;
    line-height: 1.5;
    color: var(--ink);
    background: var(--bg);
    margin: 0;
    padding: 0 16px 48px;
  }

  .wrap { max-width: 920px; margin: 0 auto; }
  .wrap.wide { max-width: 1140px; }

  /* ---------- nav ---------- */
  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px 0;
    align-items: center;
  }
  nav a {
    display: inline-block;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    color: var(--ink);
    text-decoration: none;
    font-size: 16px;
  }
  nav a:hover { border-color: var(--brand); color: var(--brand); }
  nav a.active { background: var(--brand); border-color: var(--brand); color: #fff; }

  h1 { font-size: 26px; margin: 4px 0 2px; }
  h2 { font-size: 21px; margin: 24px 0 8px; }
  .sub { color: var(--gray); font-size: 16px; margin-bottom: 18px; }

  /* ---------- card / form ---------- */
  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card > h3 { margin: 0 0 12px; font-size: 19px; }

  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 17px; }
  .hint { font-weight: 400; color: var(--gray); font-size: 15px; margin-bottom: 6px; }

  input[type=text], input[type=date], input[type=number], select, textarea {
    width: 100%;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 17px;
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: 6px;
    background: #fff;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(13, 119, 165, .25); border-color: var(--brand); }
  textarea { min-height: 78px; resize: vertical; }
  .field { margin-bottom: 14px; }
  label.choice { display: flex; gap: 8px; align-items: flex-start; font-weight: 400; margin: 6px 0; }
  label.choice input { margin-top: 6px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > .field { flex: 1 1 220px; }

  button {
    font-family: inherit;
    font-size: 18px;
    padding: 9px 20px;
    border: 0;
    border-radius: 6px;
    background: var(--brand);
    color: #fff;
    cursor: pointer;
    margin-right: 8px;
  }
  button:hover { background: var(--brand-dark); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost { background: #fff; color: var(--gray); border: 1px solid var(--border); font-size: 16px; padding: 5px 14px; }
  button.ghost:hover { color: var(--brand); border-color: var(--brand); }
  button.danger { background: var(--danger); }
  button.danger:hover { background: #8f1c13; }

  /* ---------- status ---------- */
  .msg { margin-top: 12px; font-size: 17px; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--danger); }
  .msg.wait { color: var(--gray); }

  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 14px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--gray);
    white-space: nowrap;
  }
  .badge.approved { background: #e7f6ee; border-color: #a6ddc1; color: var(--ok); }
  .badge.wait { background: #fff6e5; border-color: #f0d08a; color: var(--warn); }
  .badge.rejected { background: #fdeceb; border-color: #f0b3ae; color: var(--danger); }
  .badge.obsolete { background: #eef0f3; color: var(--gray); text-decoration: line-through; }

  .meta-table { width: 100%; border-collapse: collapse; font-size: 17px; }
  .meta-table th, .meta-table td { border: 1px solid var(--border); padding: 7px 10px; text-align: left; vertical-align: top; }
  .meta-table th { width: 34%; background: #f3f4f6; font-weight: 600; }

  .note-box { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: #fafbfc; font-size: 17px; }

  /* ---------- signature blocks (หน้าเว็บ + ใบปก) ---------- */
  .sigs { display: flex; gap: 14px; justify-content: space-between; margin-top: 20px; flex-wrap: wrap; }
  .sig { flex: 1 1 200px; text-align: center; font-size: 15px; }
  .sig img { max-height: 70px; max-width: 100%; display: block; margin: 0 auto 2px; }
  .sig-blank { height: 70px; }
  .sig-line { border-top: 1px dotted #333; margin: 0 6px 4px; }
  .sig-name { font-weight: 600; }
  .sig-title { color: var(--gray); }
  .sig-date { color: var(--gray); font-size: 14px; }
  .sig-note {
    font-size: 14px; text-align: left; background: #f8f9fa;
    border: 1px solid var(--border); border-radius: 4px; padding: 4px 6px; margin-bottom: 6px;
  }

  a { color: var(--brand); }
  .mini { font-size: 14px; color: var(--gray); }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  /* ---------- v2.0: หน้ารวม / Audit / CAPA ---------- */
  .warnbar {
    background: #fff6e5; border: 1px solid #f0d08a; color: #7a4a05;
    border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-size: 15px;
  }
  .warnbar b { color: #b45309; }

  .tiles { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 18px; }
  .tile {
    flex: 1 1 170px; background: #fff; border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 16px;
  }
  .tile .n { font-size: 28px; font-weight: 700; line-height: 1.15; }
  .tile .k { font-size: 15px; color: var(--gray); }
  .tile.alert { border-color: #f0b3ae; background: #fdf6f5; }
  .tile.alert .n { color: var(--danger); }
  .tile.warn { border-color: #f0d08a; background: #fffcf5; }
  .tile.warn .n { color: var(--warn); }

  .list-row {
    display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    padding: 9px 0; font-size: 16px;
  }
  .list-row + .list-row { border-top: 1px solid var(--border); }
  .list-row .key { font-weight: 600; min-width: 108px; }
  .list-row .grow { flex: 1 1 220px; }

  .crumb { font-size: 16px; color: var(--gray); margin-bottom: 8px; }
  .crumb a { cursor: pointer; }

  .section-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 22px 0 8px; }
  .section-head h2 { margin: 0; }
  .section-head .spacer { flex: 1; }

  table.list { width: 100%; border-collapse: collapse; font-size: 16px; }
  table.list th, table.list td { border: 1px solid var(--border); padding: 7px 9px; text-align: left; vertical-align: top; }
  table.list th { background: #f3f4f6; font-weight: 600; font-size: 15px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips label {
    font-weight: 400; font-size: 15px; display: inline-flex; gap: 5px; align-items: center;
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 11px; background: #fff; margin: 0;
  }

  .stepper { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .stepper span {
    font-size: 14px; color: var(--gray); background: #fff;
    border: 1px solid var(--border); border-radius: 99px; padding: 3px 12px;
  }
  .stepper span.now { background: var(--brand); border-color: var(--brand); color: #fff; }
  .stepper span.done { background: #e7f6ee; border-color: #a6ddc1; color: var(--ok); }

  @media print {
    .no-print { display: none !important; }
    body { background: #fff; padding: 0; font-size: 15px; }
    .card { border: 0; padding: 0; }
  }
</style>
